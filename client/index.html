<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>인생오컷 서버 연결 확인</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 640px;
      margin: 0 auto;
      padding: 40px 20px;
      line-height: 1.6;
    }
    h1 { font-size: 20px; }
    .notice {
      background: #f4f4f5;
      border-left: 3px solid #999;
      padding: 12px 16px;
      font-size: 14px;
      margin-bottom: 32px;
    }
    fieldset {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
    }
    legend { font-size: 14px; font-weight: 600; padding: 0 6px; }
    label { display: block; font-size: 14px; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-bottom: 12px;
    }
    button {
      padding: 10px 18px;
      font-size: 15px;
      border: 0;
      border-radius: 6px;
      background: #2a63e4;
      color: #fff;
      cursor: pointer;
    }
    pre {
      background: #1b1b1f;
      color: #e7e7ea;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <h1>인생오컷 서버 연결 확인</h1>

  <p class="notice">
    이 페이지는 서버 동작을 확인하기 위한 임시 페이지입니다.
    실제 촬영 화면(client 코드)이 준비되면 이 파일은 교체됩니다.
  </p>

  <fieldset>
    <legend>1. 서버 응답 확인</legend>
    <button id="health-btn">GET /health 호출</button>
    <pre id="health-result"></pre>
  </fieldset>

  <fieldset>
    <legend>2. 업로드 확인</legend>
    <label for="phone">전화번호</label>
    <input id="phone" type="tel" inputmode="numeric" placeholder="01012345678">

    <label for="camera">사진 (카메라 또는 앨범)</label>
    <input id="camera" type="file" accept="image/*" capture="environment">

    <button id="upload-btn">POST /upload 전송</button>
    <pre id="upload-result"></pre>
  </fieldset>

  <fieldset>
    <legend>3. 카메라 API 사용 가능 여부</legend>
    <pre id="secure-result"></pre>
  </fieldset>

  <script>
    const healthBtn = document.getElementById('health-btn');
    const healthResult = document.getElementById('health-result');
    const uploadBtn = document.getElementById('upload-btn');
    const uploadResult = document.getElementById('upload-result');
    const phoneInput = document.getElementById('phone');
    const cameraInput = document.getElementById('camera');
    const secureResult = document.getElementById('secure-result');

    healthBtn.addEventListener('click', async () => {
      healthResult.textContent = '요청 중...';

      try {
        const response = await fetch('/health');
        const data = await response.json();
        healthResult.textContent = `${response.status} ${JSON.stringify(data)}`;
      } catch (err) {
        healthResult.textContent = `실패: ${err.message}`;
      }
    });

    uploadBtn.addEventListener('click', async () => {
      const file = cameraInput.files[0];

      if (!file) {
        uploadResult.textContent = '사진을 먼저 선택하세요.';
        return;
      }

      uploadResult.textContent = '전송 중...';

      const form = new FormData();
      form.append('phone', phoneInput.value);
      form.append('photo', file, 'capture.png');

      try {
        const response = await fetch('/upload', { method: 'POST', body: form });
        const data = await response.json();
        uploadResult.textContent = `${response.status} ${JSON.stringify(data, null, 2)}`;
      } catch (err) {
        uploadResult.textContent = `실패: ${err.message}`;
      }
    });

    secureResult.textContent = [
      `현재 주소: ${location.href}`,
      `보안 컨텍스트(isSecureContext): ${window.isSecureContext}`,
      `getUserMedia 사용 가능: ${Boolean(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)}`,
    ].join('\n');
  </script>
</body>
</html>
